[project]
name = "sift"
version = "0.1.0"
description = "Turn your Instagram saves into a searchable local second brain (Agno agents, local-first)."
requires-python = ">=3.11"
dependencies = [
  "agno>=2.7,<3",             # PIN v2 — v1 tutorials are stale (breaking rewrite)
  "anthropic>=0.40",          # agno's Claude wrapper imports the SDK at module load
  "gallery-dl>=1.27",         # cookie_fetch: saved-folder + captions
  "yt-dlp>=2024.8.6",
  "trafilatura>=1.9",         # links
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
# Heavy deps live in extras so F0 installs stay light — add per phase (BUILD_CHECKLIST.md).
# Guardrails need no extra: Agno built-ins + stdlib (Presidio/LLM Guard cut — AGENTS.md §3).
stt = ["faster-whisper>=1.0"] # F4: reels STT (with freeflow)
rag = ["lancedb>=0.9", "openai>=1.40"]  # F5: Agno Knowledge / RAG (local, embedded); openai = embedder client, also speaks Ollama's /v1
dev = ["pytest>=8", "ruff>=0.5", "black>=24.4"]

[project.scripts]
sift = "sift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]
